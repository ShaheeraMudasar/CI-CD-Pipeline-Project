[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle – standard style checks
    "F",    # pyflakes – common errors and warnings
    "B",    # flake8-bugbear – potential bugs and code smells
    "I",    # isort – sorts imports
    "UP",   # pyupgrade – suggests modern Python syntax
    "RUF",  # Ruff-specific rules
    "C4",   # catches unnecessary list/dict comprehensions
    "SIM",  # suggests simpler, more readable code
    "ARG",  # detects unused function arguments
    "RET",  # enforces clearer return flows
    "N",    # enforces consistent naming for classes and functions
]
ignore = [
    "E501",  # Ignorera långa rader (över 100 tecken)
]
exclude = ["infra/*"]

[tool.ruff.format]
# These settings apply only when you run `ruff format`
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
addopts = [
  "--cov=app",
  "--cov-fail-under=75",
  "--cov-report=json",
  "--cov-report=term-missing",
  "--cov-report=html",
]

pythonpath = ["."]
testpaths = ["tests"]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
omit = [ 
  "app/start.py", # ingen kod som behöver testas
  "app/storage/ddb.py", # skippar nu eftersom det är testkod
  "app/env.py",
  "app/main.py",
  "app/models.py"
] 

[tool.coverage.report]
show_missing = true
skip_covered = false