[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle - standard stilkontroller
    "F",    # pyflakes - vanliga fel och varningar
    "B",    # flake8-bugbear - potentiella buggar och problem
    "I",    # isort - sorterar importer
    "UP",   # pyupgrade - föreslår modern Python-syntax
    "RUF",  # Ruff-specifika regler
    "C4",   # Fångar onödiga list/dict-comprensions
    "SIM",  # Föreslår enklare, mer läsbar kod
    "ARG",  # Hittar o­använda funktionsargument
    "RET",  # För tydligare return flöden
    "N",    # För konsekventa namn på klasser och funktioner
]

exclude = ["tests/*", "infra/*"]

[tool.ruff.format]
# Dessa inställningar gäller endast när du kör `ruff format`
quote-style = "double"
indent-style = "space"
line-ending = "auto"