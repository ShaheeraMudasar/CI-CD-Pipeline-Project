[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle – standard style checks
    "F",    # pyflakes – common errors and warnings
    "B",    # flake8-bugbear – potential bugs and code smells
    "I",    # isort – sorts imports
    "UP",   # pyupgrade – suggests modern Python syntax
    "RUF",  # Ruff-specific rules
    "C4",   # catches unnecessary list/dict comprehensions
    "SIM",  # suggests simpler, more readable code
    "ARG",  # detects unused function arguments
    "RET",  # enforces clearer return flows
    "N",    # enforces consistent naming for classes and functions
]

exclude = ["tests/*", "infra/*"]

[tool.ruff.format]
# These settings apply only when you run `ruff format`
quote-style = "double"
indent-style = "space"
line-ending = "auto"