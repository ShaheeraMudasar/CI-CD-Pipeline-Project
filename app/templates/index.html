<!doctype html>
<html>
  <head>
    <title>DevOps1-bloggen (stubbe)</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    </style>
  </head>
  <body>
    <h1>DevOps1-bloggen</h1>
    {% if posts %}
      <ul>
        {% for post in posts %}
          <li>
            <a href="/posts/{{ post.id }}">{{ post.title }}</a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>Inga inlägg tillgängliga.</p>
    {% endif %}
  </body>
</html>
